<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Connexion · ELITEshop</title>
<meta name="description" content="ELITEshop, connexion à l’espace de gestion.">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Italiana&family=Hanken+Grotesk:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f7f4ef; --paper:#eee9e1; --ink:#1c1917; --ink2:#5a524b; --muted:#978d83; --line:#e2dbd0;
  --accent:#6b2532;
  --disp:"Italiana","Didot",Georgia,serif;
  --sans:"Hanken Grotesk","Helvetica Neue",Arial,sans-serif;
  --pad:clamp(18px,3.2vw,56px); --hh:78px; --gap:6px;
  --ease:cubic-bezier(.22,.61,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:300 14px/1.75 var(--sans);letter-spacing:.01em;-webkit-font-smoothing:antialiased}
body.solid{padding-top:var(--hh)}
[id]{scroll-margin-top:calc(var(--hh) + 28px)}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;letter-spacing:inherit;text-transform:inherit}
:focus-visible{outline:1px solid var(--accent);outline-offset:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.cap{font:400 10.5px/1.4 var(--sans);letter-spacing:.32em;text-transform:uppercase}
.disp{font-family:var(--disp);font-weight:400;text-transform:uppercase;letter-spacing:.2em;line-height:1.12}
.btn-line{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 38px;border:1px solid currentColor;
  font:400 10.5px/1 var(--sans);letter-spacing:.34em;text-transform:uppercase;transition:background .5s var(--ease),color .5s var(--ease),border-color .5s}
.btn-line--w{color:#fff;border-color:rgba(255,255,255,.75)}
.btn-line--w:hover{background:#fff;color:var(--ink)}
.btn-line--d:hover{background:var(--ink);color:#fff}
.btn-fill{display:flex;align-items:center;justify-content:center;min-height:54px;background:var(--ink);color:#fff;width:100%;
  font:400 10.5px/1 var(--sans);letter-spacing:.34em;text-transform:uppercase;transition:background .4s}
.btn-fill:hover{background:var(--accent)}
.ul{position:relative;padding-bottom:5px}
.ul::after{content:"";position:absolute;left:0;bottom:0;width:100%;height:1px;background:currentColor;transform:scaleX(.35);transform-origin:left;transition:transform .6s var(--ease)}
a:hover>.ul::after,.ul:hover::after{transform:scaleX(1)}

/* en-tete */
.hd{position:fixed;top:0;left:0;right:0;z-index:60;height:var(--hh);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;
  padding:0 var(--pad);color:var(--ink);transition:background .5s,color .5s,border-color .5s;border-bottom:1px solid transparent}
.hd.is-over{color:#fff}
.hd.is-solid,body.solid .hd{background:rgba(247,244,239,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:var(--ink);border-bottom-color:var(--line)}
.hd__l{display:flex;align-items:center}
.hd__r{display:flex;justify-content:flex-end;align-items:center;gap:8px}
.mbtn{display:inline-flex;align-items:center;gap:14px;height:44px}
.mbtn i{display:grid;gap:6px;width:24px}
.mbtn i::before,.mbtn i::after{content:"";height:1px;background:currentColor;display:block}
.mbtn i::after{width:15px}
.ico{width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;position:relative}
.ico svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.1}
.bag .count{position:absolute;top:9px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--accent);font-size:0}
.logo{display:inline-flex;align-items:baseline;gap:4px;white-space:nowrap;line-height:1}
.logo b{font:400 25px/1 var(--disp);letter-spacing:.36em;margin-right:-.1em}
.logo span{font:300 11px/1 var(--sans);letter-spacing:.3em}

/* menu plein ecran */
.fm{position:fixed;inset:0;z-index:120;background:var(--bg);display:grid;grid-template-columns:1fr 1fr;
  clip-path:inset(0 0 100% 0);transition:clip-path .9s var(--ease);visibility:hidden}
.fm.on{clip-path:inset(0 0 0 0);visibility:visible}
.fm__l{display:flex;flex-direction:column;padding:0 var(--pad) 40px;overflow:auto}
.fm__top{height:var(--hh);display:flex;align-items:center;flex:none}
.fm__nav{margin:auto 0;padding:30px 0 30px clamp(0px,4vw,70px)}
.fm__nav li{list-style:none;overflow:hidden}
.fm__nav>li{padding:6px 0}
.fm__nav>li>a{display:inline-block;font:400 clamp(34px,4.4vw,64px)/1.15 var(--disp);letter-spacing:.14em;text-transform:uppercase;
  transform:translateY(105%);transition:transform .9s var(--ease),color .3s}
.fm.on .fm__nav>li>a{transform:none}
.fm.on .fm__nav>li:nth-child(2)>a{transition-delay:.06s}.fm.on .fm__nav>li:nth-child(3)>a{transition-delay:.12s}.fm.on .fm__nav>li:nth-child(4)>a{transition-delay:.18s}.fm.on .fm__nav>li:nth-child(5)>a{transition-delay:.24s}
.fm__nav>li>a:hover{color:var(--accent)}
.fm__sub{display:flex;flex-wrap:wrap;gap:8px 26px;padding:4px 0 10px 4px}
.fm__sub a{color:var(--ink2)}
.fm__sub a:hover{color:var(--ink)}
.fm__foot{display:flex;justify-content:space-between;gap:20px;color:var(--muted);flex:none}
.fm__r{position:relative;overflow:hidden;background:var(--paper)}
.fm__r img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transform:scale(1.06);transition:opacity .9s var(--ease),transform 2.4s var(--ease)}
.fm__r img.on{opacity:1;transform:none}

/* emplacements video */
.vslot{position:relative;overflow:hidden;background:#3a302a}
.vslot__fb{position:absolute;inset:0}
.vslot__fb img{width:100%;height:100%;object-fit:cover}
.kb img,.kb.vslot__fb img{animation:kb 26s ease-in-out infinite alternate;transform-origin:50% 55%}
@keyframes kb{from{transform:scale(1.001)}to{transform:scale(1.1)}}
.vslot__video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 1.2s}
.vslot.is-video .vslot__video{opacity:1}
.vslot.is-video .vslot__fb{opacity:0}
.shade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(18,13,10,.22) 0%,rgba(18,13,10,0) 22%,rgba(18,13,10,0) 55%,rgba(18,13,10,.42) 100%)}

/* legendes */
.mq-tag{position:absolute;z-index:6;left:12px;top:12px;background:rgba(28,25,23,.72);color:#f3ece2;font:500 9px/1 var(--sans);
  letter-spacing:.16em;text-transform:uppercase;padding:6px 8px;pointer-events:none;white-space:nowrap;display:none}
.mq-tag--photo{background:rgba(107,37,50,.85)}.mq-tag--four{background:rgba(110,96,80,.85)}
.mq-tag--video{background:rgba(255,255,255,.94);color:var(--ink);padding:8px 10px;top:calc(var(--hh) + 10px);left:var(--pad)}
.tags .mq-tag{display:block}
.mq-pill{position:fixed;right:14px;bottom:14px;z-index:80;background:rgba(28,25,23,.86);color:#f3ece2;font:500 9px/1 var(--sans);letter-spacing:.2em;
  text-transform:uppercase;padding:9px 13px;border-radius:30px;opacity:.55;transition:opacity .3s}
.mq-pill:hover{opacity:1}
.note{font-size:11.5px;color:var(--muted);letter-spacing:.02em}

/* cartes */
.card{display:block}
.card__img{position:relative;aspect-ratio:3/4;overflow:hidden;background:var(--paper)}
.card__img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .8s var(--ease),transform 1.6s var(--ease)}
.card__img img.fit{object-fit:contain}
.card__img img.alt{opacity:0}
.card:hover .card__img img.alt{opacity:1}
.card:hover .card__img img{transform:scale(1.03)}
.card__info{padding:16px 2px 0;display:grid;gap:5px}
.card__name{font:400 10.5px/1.6 var(--sans);letter-spacing:.2em;text-transform:uppercase}
.card__sub{font-size:12.5px;color:var(--muted)}

/* defilement horizontal */
.rail__hd{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;padding:0 var(--pad) 34px}
.rail__hd h2{font-size:clamp(28px,3vw,44px)}
.rail__ctl{display:flex;align-items:center;gap:22px}
.rail__ctl button{width:40px;height:40px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:50%;transition:border-color .3s}
.rail__ctl button:hover{border-color:var(--ink)}
.rail__ctl svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.2}
.rail__track{display:grid;grid-auto-flow:column;grid-auto-columns:clamp(260px,29vw,520px);gap:var(--gap);overflow-x:auto;scroll-snap-type:x mandatory;
  padding:0 var(--pad);scroll-padding:0 var(--pad);scrollbar-width:none}
.rail__track::-webkit-scrollbar{display:none}
.rail__track>*{scroll-snap-align:start}
.rail__bar{margin:34px var(--pad) 0;height:1px;background:var(--line);position:relative}
.rail__bar i{position:absolute;left:0;top:0;height:1px;background:var(--ink);width:20%;transition:transform .2s linear}

/* pied de page */
.ft{padding:110px var(--pad) 34px;text-align:center;border-top:1px solid var(--line);margin-top:clamp(90px,12vw,170px)}
.ft .logo b{font-size:30px}
.ft__links{display:flex;justify-content:center;flex-wrap:wrap;gap:12px 38px;margin:44px 0 50px}
.ft__links a{color:var(--ink2)}.ft__links a:hover{color:var(--ink)}
.ft form{display:flex;max-width:420px;margin:0 auto;border-bottom:1px solid var(--ink)}
.ft input{flex:1;background:none;border:0;font:300 14px var(--sans);padding:12px 0;outline:none;color:var(--ink);text-align:left}
.ft input::placeholder{color:var(--muted)}
.ft__bot{display:flex;justify-content:space-between;gap:20px;margin-top:90px;color:var(--muted)}
.ft__bot a:hover{color:var(--ink)}

/* panneaux */
.ov{position:fixed;inset:0;background:rgba(28,25,23,.32);z-index:90;opacity:0;visibility:hidden;transition:opacity .5s,visibility .5s}
.ov.on{opacity:1;visibility:visible}
.drw{position:fixed;top:0;bottom:0;right:0;width:min(460px,100%);background:var(--bg);z-index:100;display:flex;flex-direction:column;
  transform:translateX(100%);transition:transform .7s var(--ease)}
.drw.on{transform:none}
.drw__hd{display:flex;align-items:center;justify-content:space-between;height:var(--hh);padding:0 30px;border-bottom:1px solid var(--line)}
.drw__bd{flex:1;overflow:auto;padding:6px 30px}
.drw__ft{padding:24px 30px 30px;border-top:1px solid var(--line);display:grid;gap:14px}
.ci{display:grid;grid-template-columns:92px 1fr;gap:18px;padding:22px 0;border-bottom:1px solid var(--line)}
.ci img{width:92px;aspect-ratio:3/4;object-fit:cover;background:var(--paper)}
.ci h3{font:400 10.5px/1.6 var(--sans);letter-spacing:.18em;text-transform:uppercase;margin-bottom:6px}
.ci p{font-size:12.5px;color:var(--ink2)}
.ci__row{display:flex;justify-content:space-between;align-items:center;margin-top:12px}
.qty{display:inline-flex;align-items:center;gap:14px;font-size:13px}
.qty button{width:22px;height:22px;border:1px solid var(--line);border-radius:50%;line-height:1}
.rm{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.tot{display:flex;justify-content:space-between}
.empty{padding:70px 0;text-align:center;color:var(--muted)}
.srch{position:fixed;left:0;right:0;top:0;z-index:110;background:var(--bg);padding:0 var(--pad) 50px;transform:translateY(-102%);
  transition:transform .8s var(--ease);max-height:92vh;overflow:auto;border-bottom:1px solid var(--line)}
.srch.on{transform:none}
.srch__bar{display:flex;align-items:center;gap:16px;height:var(--hh);border-bottom:1px solid var(--line)}
.srch__bar input{flex:1;border:0;background:none;font:400 24px/1.2 var(--disp);letter-spacing:.14em;text-transform:uppercase;outline:none;color:var(--ink)}
.srch__res{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--gap);margin:30px auto 0;max-width:1180px}

/* apparition */
.js .rv{opacity:0;transform:translateY(26px);transition:opacity 1.2s var(--ease),transform 1.2s var(--ease)}
.js .rv.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){.kb img{animation:none}.js .rv{opacity:1;transform:none}*{transition-duration:.01ms!important}}

@media (max-width:900px){
  .fm{grid-template-columns:1fr}.fm__r{display:none}
}
@media (max-width:767px){
  :root{--hh:62px;--gap:4px}
  .mbtn .cap{display:none}
  .logo b{font-size:21px}.logo span{font-size:10px}
  .hd__r{gap:0}
  .rail__track{grid-auto-columns:72vw}
  .rail__hd{padding-bottom:24px}.rail__ctl button{display:none}
  .ft{padding-top:80px}.ft__links{gap:12px 24px}.ft__bot{flex-direction:column;align-items:center;margin-top:60px}
  .srch__res{grid-template-columns:1fr 1fr}
  .mq-tag--video{font-size:8px;max-width:calc(100% - 36px);white-space:normal;line-height:1.3}
}

body{min-height:100vh;min-height:100svh}
.lg{min-height:100vh;min-height:100svh;display:grid;grid-template-columns:1.08fr 1fr}
.lg__vis{position:relative;overflow:hidden;background:var(--paper);margin:0}
.lg__vis img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 24%;animation:kb 26s ease-in-out infinite alternate}
.lg__vis .shade{background:linear-gradient(180deg,rgba(18,13,10,.28) 0%,rgba(18,13,10,0) 26%,rgba(18,13,10,0) 58%,rgba(18,13,10,.5) 100%)}
.lg__vis .logo{position:absolute;left:clamp(24px,3vw,48px);top:30px;color:#fff;z-index:3}
.lg__vis figcaption{position:absolute;left:clamp(24px,3vw,48px);right:24px;bottom:clamp(30px,6vh,60px);color:#fff;z-index:3}
.lg__vis figcaption p.disp{font-size:clamp(30px,3.4vw,54px);letter-spacing:.16em;margin-bottom:16px}
.lg__side{display:flex;flex-direction:column;padding:0 var(--pad);min-width:0}
.lg__top{height:var(--hh);display:flex;align-items:center;justify-content:space-between;gap:20px;flex:none}
.lg__top .logo{visibility:hidden}
.lg__back{display:inline-flex;align-items:center;gap:10px;color:var(--ink2)}
.lg__back svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.3}
.lg__back:hover{color:var(--ink)}
.lg__form{margin:auto;width:100%;max-width:390px;padding:56px 0 64px}
.lg__mark{width:58px;height:58px;border:1px solid var(--accent);border-radius:50%;display:grid;place-items:center;
  font:400 27px/1 var(--disp);color:var(--accent);margin-bottom:38px;padding-left:.06em}
.lg__eyebrow{color:var(--muted)}
.lg h1{font-size:clamp(30px,2.9vw,44px);letter-spacing:.16em;margin:16px 0 18px}
.lg__lead{color:var(--ink2);margin-bottom:48px;max-width:34ch}
.fld{display:block;margin-bottom:32px}
.fld>span{display:block;color:var(--muted);margin-bottom:4px;transition:color .3s}
.fld:focus-within>span{color:var(--accent)}
.fld input{width:100%;border:0;border-bottom:1px solid #cfc5b8;border-radius:0;background:transparent;font:300 16px/1.4 var(--sans);
  letter-spacing:.02em;padding:12px 0;color:var(--ink);outline:none;transition:border-color .4s;-webkit-appearance:none}
.fld input::placeholder{color:#b9aea3}
.fld input:focus{border-bottom-color:var(--accent)}
.pw{position:relative}
.pw input{padding-right:84px}
.pw button{position:absolute;right:0;bottom:8px;color:var(--ink2);padding:6px 0}
.pw button:hover{color:var(--ink)}
.lg .btn-fill{margin-top:16px}
.lg .btn-fill:disabled{opacity:.6;cursor:progress}
.lg__msg{margin-top:18px;color:var(--accent);font-size:12.5px;letter-spacing:.02em}
.lg__bot{display:flex;justify-content:space-between;gap:20px;color:var(--muted);padding:0 0 28px;flex:none}
@media (max-width:900px){
  .lg{grid-template-columns:1fr}.lg__vis{display:none}
  .lg__top .logo{visibility:visible}
}
@media (max-width:767px){
  .lg__form{padding:40px 0 56px}.lg__mark{margin-bottom:30px}
  .lg__bot{flex-direction:column;align-items:center;gap:6px}
}
@media (prefers-reduced-motion:reduce){.lg__vis img{animation:none}}
</style>
</head>
<body>
<main class="lg">
  <figure class="lg__vis">
    <img src="assets/img/gen-lot3-07.jpg" alt="">
    <span class="mq-tag">Image générée</span>
    <div class="shade"></div>
    <a class="logo" href="index.html" aria-label="ELITEshop, accueil"><b>ELITE</b><span>shop</span></a>
    <figcaption><p class="disp">Nouvelle<br>saison</p><p class="cap">Prêt-à-porter, abayas et chaussures femme</p></figcaption>
  </figure>
  <div class="lg__side">
    <div class="lg__top">
      <a class="logo" href="index.html" aria-label="ELITEshop, accueil"><b>ELITE</b><span>shop</span></a>
      <a class="lg__back cap" href="index.html"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg><span class="ul">Retour à la boutique</span></a>
    </div>
    <div class="lg__form">
      <span class="lg__mark" aria-hidden="true">E</span>
      <p class="lg__eyebrow cap">Espace réservé</p>
      <h1 class="disp">Connexion admin</h1>
      <p class="lg__lead">Accès à la gestion de la boutique.</p>
      <form data-login novalidate>
        <label class="fld"><span class="cap">Email</span><input type="email" name="email" autocomplete="username" inputmode="email" autocapitalize="off" spellcheck="false" placeholder="vous@exemple.com" required></label>
        <label class="fld"><span class="cap">Mot de passe</span><span class="pw"><input type="password" name="password" autocomplete="current-password" required><button type="button" class="cap" data-pw aria-pressed="false">Afficher</button></span></label>
        <button class="btn-fill" type="submit" data-submit>Se connecter</button>
        <p class="lg__msg" data-login-msg role="alert" aria-live="assertive" hidden></p>
      </form>
    </div>
    <div class="lg__bot cap"><span>© 2026 ELITEshop</span><span>Casablanca, Maroc</span></div>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.74.0/dist/umd/supabase.min.js" integrity="sha384-b+VshJ+niaJb5lNc3Bqqo9KUTg3Hq/ZavF5+sP4EKFaHtYBTU+2K7JqGBPumqhlW" crossorigin="anonymous"></script>
<script src="assets/admin-supabase.js"></script>
<script>
(function () {
  var db = window.ELITE_DB;
  var f = document.querySelector('[data-login]');
  var msg = document.querySelector('[data-login-msg]');
  var btn = document.querySelector('[data-submit]');
  var email = f.querySelector('input[name="email"]');
  var pass = f.querySelector('input[name="password"]');

  function dire(t) { msg.textContent = t; msg.hidden = !t; }

  /* traduction des erreurs Supabase en francais */
  function traduire(err) {
    var m = (err && err.message ? err.message : '').toLowerCase();
    var st = err && err.status;
    if (m.indexOf('invalid login credentials') >= 0) return 'Email ou mot de passe incorrect.';
    if (m.indexOf('email not confirmed') >= 0) return 'Cette adresse email n\u2019a pas encore été confirmée. Ouvrez le lien reçu par email, puis réessayez.';
    if (st === 429 || m.indexOf('rate limit') >= 0 || m.indexOf('too many') >= 0) return 'Trop de tentatives. Patientez quelques minutes puis réessayez.';
    if (m.indexOf('failed to fetch') >= 0 || m.indexOf('network') >= 0 || m.indexOf('fetch') >= 0) return 'Connexion au serveur impossible. Vérifiez votre connexion internet puis réessayez.';
    if (m.indexOf('user is banned') >= 0) return 'Ce compte est désactivé.';
    return 'La connexion a échoué. Réessayez dans un instant.';
  }

  if (!db) {
    dire('Le service de connexion n\u2019a pas pu être chargé. Vérifiez votre connexion internet puis rechargez la page.');
    btn.disabled = true;
  } else {
    /* deja connecte : direction l'admin */
    db.auth.getSession().then(function (r) {
      if (r && r.data && r.data.session) location.replace('admin.html');
    });
  }

  f.addEventListener('submit', function (e) {
    e.preventDefault();
    if (!db) return;
    var em = email.value.trim(), pw = pass.value;
    if (!em || !pw) { dire('Saisissez votre email et votre mot de passe.'); (em ? pass : email).focus(); return; }
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)) { dire('Cette adresse email n\u2019est pas valide.'); email.focus(); return; }
    dire('');
    btn.disabled = true; btn.textContent = 'Connexion\u2026';
    db.auth.signInWithPassword({ email: em, password: pw }).then(function (r) {
      if (r.error) throw r.error;
      if (!r.data || !r.data.session) throw new Error('session absente');
      location.replace('admin.html');
    }).catch(function (err) {
      dire(traduire(err));
      btn.disabled = false; btn.textContent = 'Se connecter';
      pass.select();
    });
  });

  var pb = document.querySelector('[data-pw]');
  pb.addEventListener('click', function () {
    var show = pass.type === 'password';
    pass.type = show ? 'text' : 'password';
    pb.textContent = show ? 'Masquer' : 'Afficher';
    pb.setAttribute('aria-pressed', show);
  });
  if (new URLSearchParams(location.search).get('legendes') === '1') document.body.classList.add('tags');
})();
</script>
</body>
</html>
