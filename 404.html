<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ELITEshop</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:,">
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f7f4ef;color:#1c1917;font:300 15px/1.7 "Helvetica Neue",Arial,sans-serif;text-align:center;padding:24px}a{color:inherit}</style>
<script>
/* Redirige les anciennes adresses du site (version precedente) vers les nouvelles pages. */
(function(){
  var base = location.hostname.endsWith('github.io') ? '/' + location.pathname.split('/')[1] + '/' : '/';
  var p = location.pathname.slice(base.length - 1).replace(/\/+$/, '') || '/';
  var m, to = null;
  if ((m = p.match(/^\/product\/(.+)$/))) to = 'produit.html?p=' + m[1];
  else if (p === '/shop') to = 'collection.html?cat=tout' + (location.search ? '&' + location.search.slice(1) : '');
  else if (p === '/collections') to = 'collections.html';
  else if ((m = p.match(/^\/collections\/(.+)$/))) to = 'collection.html?coll=' + m[1];
  else if (p === '/contact') to = 'contact.html';
  else if (p === '/portfolio' || p === '/lookbook') to = 'collection.html?cat=tout';
  else if (p === '/wishlist') to = 'favoris.html';
  else if (p === '/admin/login') to = 'login.html';
  else if (p.indexOf('/admin') === 0) to = 'admin.html';
  if (to) location.replace(base + to);
  document.addEventListener('DOMContentLoaded', function(){ document.getElementById('home').href = base });
})();
</script>
</head>
<body><p>Cette page n'existe pas.<br><br><a id="home" href="/">Retour à la boutique ELITEshop</a></p></body>
</html>
